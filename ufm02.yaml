
esphome:
  name: ufm02-flow
  friendly_name: UFM02 Flow Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [ufm02]

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

sensor:
  - platform: ufm02
    id: ufm02_device
    cs_pin: GPIO5
    int_pin: GPIO2
    update_interval: 1s

    flow:
      name: "Water Flow Rate"
      icon: mdi:water-pump

    filtered_flow:
      name: "Water Filtered Flow Rate"
      icon: mdi:water

    total_volume:
      name: "Water Total Volume"
      icon: mdi:counter

    temperature:
      name: "Water Temperature"
      icon: mdi:thermometer

    error_flags:
      name: "Water Sensor Error Flags"
      icon: mdi:alert-circle
