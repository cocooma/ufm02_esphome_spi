
esphome:
  name: ufm02-flow
  friendly_name: UFM02 Flow Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [ufm02]

sensor:
  - platform: ufm02
    name: "UFM02 Raw Register"
    id: ufm02_raw_register

    # UFM-02 signal pins
    cs_pin: GPIO5
    clk_pin: GPIO18
    mosi_pin: GPIO23
    miso_pin: GPIO19
    int_pin: GPIO2

    # Replace with a verified RAM/register address
    # from the ScioSense library or datasheet.
    register_address: 0x00

    update_interval: 1s

    # Initial communication speed; verify against
    # your sensor and wiring.
    data_rate: 1MHz
